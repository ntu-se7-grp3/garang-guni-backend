services:
  backend:
    image: ${BACKEND_IMAGE:-ttanttanyj/garang-guni-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring_boot_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_DATASOURCE_DB=${SPRING_DATASOURCE_DB}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${SPRING_DATASOURCE_DB}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CONNECTION_TO_DATABASE_HOST_PORT=${CONNECTION_TO_DATABASE_HOST_PORT}
    depends_on:
      - db

  db:
    image: postgis/postgis:16-3.4
    container_name: spring_boot_db
    environment:
      - POSTGRES_USER=${SPRING_DATASOURCE_USERNAME}
      - POSTGRES_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - POSTGRES_DB=${SPRING_DATASOURCE_DB}
    ports:
      - "5432:5432"
